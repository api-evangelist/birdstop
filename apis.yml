aid: birdstop
name: Birdstop
description: >-
  Birdstop is an American autonomous-drone and remote-sensing company that lets
  organizations monitor and inspect field assets at scale without personnel
  onsite. Its Fealty system is an all-weather, always-on drone that launches in
  under three seconds, flies for up to 45 minutes, cruises at 45 mph, and
  patrols 24/7 across public safety, utilities, transportation, construction,
  and data-center sites. Birdstop pairs networked UAVs and ground stations with
  computer vision and a patented optical/acoustic detect-and-avoid system to
  enable safe beyond-visual-line-of-sight flight under some of the FAA's most
  advanced approvals, delivering Observation-on-Demand intel over the internet.
  The company is FAA-authorized, SOC 2 certified, and NDAA compliant, and builds
  its drones in Detroit. Backed by Techstars, Birdstop currently exposes no
  public developer API; this profile tracks the company for the API Evangelist
  network.
